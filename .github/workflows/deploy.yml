name: Deploy TCGstore Spring Boot to EC2 via GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vicente-palacios/tcgstore
  CONTAINER_NAME: tcgstore

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # 1. Descargar el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # 3. Compilar proyecto Spring Boot
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # 4. Login en GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Construir y subir imagen Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 6. Desplegar en EC2
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: TARGET_HOST_IP

          script: |

            # --- CREAR SWAP SI NO EXISTE ---
            if [ ! -f /swapfile ]; then
              echo "Instancia sin Swap. Creando 2GB..."

              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile

              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # --- INSTALAR DOCKER SI NO EXISTE ---
            if ! command -v docker &> /dev/null; then
              echo "Docker no está instalado. Instalando..."

              sudo dnf update -y
              sudo dnf install -y docker

              sudo systemctl start docker
              sudo systemctl enable docker

              sudo usermod -aG docker ec2-user
            fi

            # --- LOGIN Y DESPLIEGUE ---
            sg docker -c "

              # Login en GHCR
              echo '${{ secrets.GH_CR_PAT }}' | docker login ${{ env.REGISTRY }} \
                -u ${{ github.actor }} \
                --password-stdin

              # Descargar imagen
              docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

              # Detener contenedor anterior
              docker stop ${{ env.CONTAINER_NAME }} || true

              # Eliminar contenedor anterior
              docker rm ${{ env.CONTAINER_NAME }} || true

              # Limpiar imágenes antiguas
              docker image prune -f

              # Ejecutar nueva versión
              docker run -d \
                --name ${{ env.CONTAINER_NAME }} \
                -p 80:8080 \
                -e PORT=8080 \
                -e PUBLIC_HOST_URL='http://$TARGET_HOST_IP' \
                --restart unless-stopped \
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            "

        env:
          TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
          GH_CR_PAT: ${{ secrets.GH_CR_PAT }}